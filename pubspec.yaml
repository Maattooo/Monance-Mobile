name: monance_mobile
description: "Monance Mobile - A sleek, high-contrast personal finance tracker built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking & HTTP
  dio: ^5.7.0

  # Navigation & Routing
  go_router: ^14.6.0

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Formatting & Calendar
  intl: ^0.20.1
  table_calendar: ^3.1.2

  # UI Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
