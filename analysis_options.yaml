analyzer:
  exclude:
    - build/**
    - android/**
    - lib/core/router/app_router.dart
    - lib/providers/storage_provider.dart
    - lib/services/storage_service.dart
    - lib/views/main_shell_view.dart
    - lib/views/calendar/calendar_view.dart
    - lib/views/dashboard/dashboard_view.dart
    - lib/views/dashboard/add_expense_sheet.dart
    - lib/views/settings/settings_view.dart
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: false
